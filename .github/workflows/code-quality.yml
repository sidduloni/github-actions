name: Code Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint check
        run: npm run lint
        # This WILL FAIL - no lint script in package.json (intentional for Teams notification testing)

  log-failure-info:
    runs-on: ubuntu-latest
    needs: quality-check
    if: failure()
    steps:
      - name: Log failure details (Teams webhook pending)
        run: |
          echo "============================================"
          echo "  WORKFLOW FAILED — Details for MS Teams"
          echo "============================================"
          echo "  Repository : ${{ github.repository }}"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Run ID     : ${{ github.run_id }}"
          echo "  Triggered  : ${{ github.actor }}"
          echo "  Commit SHA : ${{ github.sha }}"
          echo "  View Run   : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"
          echo "  (MS Teams webhook will be wired up later)"
          echo "============================================"

