
name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check index.js

      - name: Upload application files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          passphrase: ${{ secrets.CPANEL_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "index.js,package.json,package-lock.json"
          target: ${{ secrets.CPANEL_APP_ROOT }}

      - name: Install production dependencies and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_KEY }}
          passphrase: ${{ secrets.CPANEL_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            source /home/ganixvzc/nodevenv/github/24/bin/activate
            cd /home/ganixvzc/github
            npm ci --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
